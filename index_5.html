@import url('https://fonts.googleapis.com/css2?family=Anton&family=Montserrat:wght@500;600;700;800&display=swap');

.cinematch-root {
  --night:#0B1020; --navy:#1B2547; --navy-2:#2A3670; --line:#34417F;
  --red:#E02A2E; --red-dark:#B81B22;
  --gold:#FFC83D; --cream:#FFF1D0; --cream-2:#FFE3A6; --ink:#1A1230;
  --pink:#FF2E93; --pink-soft:#FF8FB8;
  --text:#FFF6E5; --text-muted:#BCC4E6; --text-dim:#8E98C4;
  --stub:180px;
  --font-display:'Skybold','Anton','Bebas Neue','Arial Narrow',Impact,sans-serif;
  --font-body:'Montserrat','Inter',system-ui,-apple-system,sans-serif;
  box-sizing: border-box;
  position: relative;
  min-height: 100vh;
  width: 100%;
  overflow-x: hidden;
  padding: 16px 16px 30px;
  display: flex;
  justify-content: center;
  color: var(--text);
  font-family: var(--font-body);
  background:
    radial-gradient(circle at 18% 22%, rgba(255,200,61,.55) 0 1.4px, transparent 2px),
    radial-gradient(circle at 82% 30%, rgba(255,143,184,.5) 0 1.4px, transparent 2px),
    radial-gradient(circle at 64% 12%, rgba(255,246,229,.5) 0 1.2px, transparent 2px),
    radial-gradient(circle at 30% 68%, rgba(255,200,61,.35) 0 1.2px, transparent 2px),
    radial-gradient(circle at 88% 74%, rgba(255,246,229,.35) 0 1.2px, transparent 2px),
    var(--night);
}
.cinematch-root *, .cinematch-root *::before, .cinematch-root *::after { box-sizing: border-box; }
.cinematch-root button { font-family: var(--font-body); -webkit-tap-highlight-color: transparent; }

.cm-shell { position: relative; width: 100%; max-width: 440px; display: flex; flex-direction: column; }
.cm-curtains { position: absolute; top: -16px; left: -16px; width: calc(100% + 32px); pointer-events: none; z-index: 0; }
.cm-curtains-fade { -webkit-mask-image: linear-gradient(#000 52%, transparent 100%); mask-image: linear-gradient(#000 52%, transparent 100%); }
.cm-screen { position: relative; z-index: 1; display: flex; flex-direction: column; flex: 1; gap: 14px; animation: cmFadeIn .3s ease; }
.cm-center { align-items: center; text-align: center; justify-content: center; }
.cm-center-text { text-align: center; align-self: center; }
.cm-center-self { align-self: center; }
@keyframes cmFadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- Tipograf\xEDa ---------- */
.cm-title { font-family: var(--font-display); font-weight: 400; font-size: 46px; line-height: .96; letter-spacing: .01em; text-transform: uppercase; margin: 0; color: var(--gold); }
.cm-subtitle { color: var(--text-muted); font-size: 15px; font-weight: 600; line-height: 1.5; margin: 0; max-width: 330px; }
.cm-label { font-size: 14px; font-weight: 700; color: var(--cream); margin-bottom: -6px; }
.cm-error { color: var(--pink-soft); font-size: 14px; font-weight: 700; margin: 0; }
.cm-footnote { color: var(--text-muted); font-size: 14px; font-weight: 600; line-height: 1.55; margin: 4px 0 8px; max-width: 320px; }

/* ---------- Botones (planos) ---------- */
.cm-btn {
  position: relative; display: flex; align-items: center; justify-content: center; gap: 10px;
  width: 100%; cursor: pointer; font-weight: 800; font-size: 17px; line-height: 1.1; letter-spacing: -.005em;
  border: 0; border-radius: 20px; padding: 18px 22px; transition: transform .1s ease, opacity .15s;
}
.cm-btn:disabled { opacity: .4; cursor: not-allowed; }
.cm-btn:active:not(:disabled) { transform: scale(.97); }
.cm-btn-primary { background: var(--gold); color: var(--ink); }
.cm-btn-primary::before, .cm-btn-primary::after { content: ""; position: absolute; top: 50%; width: 18px; height: 18px; margin-top: -9px; background: var(--night); border-radius: 50%; }
.cm-btn-primary::before { left: -9px; }
.cm-btn-primary::after { right: -9px; }
.cm-btn-danger { background: var(--red); color: #fff; }
.cm-btn-secondary { background: transparent; color: var(--cream); box-shadow: inset 0 0 0 3px var(--cream); font-weight: 700; padding: 15px 20px; }
.cm-btn-ghost { background: transparent; color: var(--text-muted); font-size: 15px; font-weight: 700; padding: 8px 12px; }
.cm-mt-auto { margin-top: auto; }

.cm-back { align-self: flex-start; display: flex; align-items: center; gap: 6px; cursor: pointer; background: var(--navy); color: var(--cream); border: 0; border-radius: 999px; font-size: 13px; font-weight: 700; padding: 8px 14px 8px 10px; }

.cm-icon-btn { display: grid; place-items: center; width: 40px; height: 40px; border-radius: 50%; flex-shrink: 0; cursor: pointer; background: var(--navy); border: 0; color: var(--cream); }
.cm-icon-btn:disabled { opacity: .35; cursor: not-allowed; }

/* ---------- Formularios ---------- */
.cm-input { width: 100%; background: var(--navy); border: 3px solid transparent; border-radius: 16px; padding: 15px 16px; color: var(--text); font-family: var(--font-body); font-weight: 700; font-size: 17px; outline: none; transition: border-color .15s; }
.cm-input::placeholder { color: var(--text-dim); font-weight: 600; }
.cm-input:focus { border-color: var(--gold); }
.cm-input-code { letter-spacing: 5px; }
.cm-chip-grid { display: flex; flex-wrap: wrap; gap: 10px; }

/* ---------- Portada ---------- */

.cm-sticker { display: inline-block; background: var(--cream); color: var(--ink); font-family: var(--font-display); text-transform: uppercase; font-size: 22px; letter-spacing: .02em; line-height: 1; padding: 9px 20px 8px; border-radius: 999px; transform: rotate(-2.5deg); margin: -2px 0 2px; }

.cm-float.f3 { top: 70px; left: 6%; animation-delay: 1.2s; }
.cm-float.f4 { bottom: 20px; right: 4%; animation-delay: .3s; }
.cm-home-actions { display: flex; flex-direction: column; gap: 14px; width: 100%; margin-top: 4px; padding: 0 8px; }

.cm-file-btn { padding: 11px 16px; font-size: 14px; width: auto; margin-top: 2px; }
@keyframes cmFloat { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-9px) rotate(3deg); } }
@keyframes cmBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.cm-bounce { animation: cmBob 1.4s ease-in-out infinite; }

/* ---------- C\xF3digo de sala ---------- */
.cm-code-board { position: relative; display: flex; align-items: center; gap: 14px; padding: 14px 22px; background: var(--red); border: 5px solid var(--gold); border-radius: 20px; }

/* ---------- Encabezado de sala (marquesina) ---------- */
.cm-swipe-header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 8px; padding-top: 4px; }
.cm-turn-pill { justify-self: start; max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; background: var(--navy); border-radius: 999px; padding: 7px 13px; font-size: 12.5px; font-weight: 800; color: var(--cream); }
.cm-undo { justify-self: end; }
.cm-marquee { position: relative; padding-top: 12px; }
.cm-marquee::before, .cm-marquee::after { content: ""; position: absolute; top: 0; width: 4px; height: 16px; background: #D8D0C4; border-radius: 2px; }
.cm-marquee::before { left: 24%; }
.cm-marquee::after { right: 24%; }
.cm-marquee-board { position: relative; white-space: nowrap; padding: 6px 20px 5px; background: var(--red); border: 4px solid var(--gold); border-radius: 14px; font-family: var(--font-display); font-size: 22px; line-height: 1.1; letter-spacing: .03em; text-transform: uppercase; color: var(--cream); }
.cm-marquee-board::after { content: ""; position: absolute; inset: -9px; border-radius: 20px; border: 4px dotted #FFF3C4; pointer-events: none; animation: cmBulb 1.6s ease-in-out infinite; }
@keyframes cmBulb { 0%,100% { opacity: 1; } 50% { opacity: .5; } }

/* ---------- Barra de palomitas ---------- */
.cm-pbar { display: flex; align-items: center; gap: 8px; margin-top: 2px; }

/* ---------- Tarjeta boleto ---------- */
.cm-card-stack { position: relative; flex: 1; min-height: 560px; margin: 4px 6px 0; }

.cm-card-bg2 { transform: rotate(4.5deg) translate(8px, 10px) scale(.95); }

.cm-card-top:active { cursor: grabbing; }
.cm-ticket {
  position: absolute; inset: 0; display: flex; flex-direction: column; padding: 12px 16px 0;
  background: var(--cream); color: var(--ink); border-radius: 28px; overflow: hidden;
  -webkit-mask: radial-gradient(circle 14px at 0 calc(100% - var(--stub)), #0000 98%, #000) left / 51% 100% no-repeat,
                radial-gradient(circle 14px at 100% calc(100% - var(--stub)), #0000 98%, #000) right / 51% 100% no-repeat;
          mask: radial-gradient(circle 14px at 0 calc(100% - var(--stub)), #0000 98%, #000) left / 51% 100% no-repeat,
                radial-gradient(circle 14px at 100% calc(100% - var(--stub)), #0000 98%, #000) right / 51% 100% no-repeat;
}
.cm-ticket-red { background: var(--red); }
.cm-ticket-cream2 { background: var(--gold); }
.cm-ticket-stars { display: flex; justify-content: space-between; padding: 0 10px; height: 22px; align-items: center; }
.cm-stub { height: var(--stub); margin: 0 -16px; padding: 14px 26px 12px; border-top: 3px dashed rgba(26,18,48,.35); display: flex; flex-direction: column; gap: 6px; flex-shrink: 0; position: relative; }
.cm-movie-title { font-family: var(--font-display); font-weight: 400; text-transform: uppercase; letter-spacing: .005em; line-height: 1; margin: 0; color: var(--ink); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cm-stub-row { display: flex; align-items: center; gap: 12px; font-weight: 800; font-size: 13px; min-width: 0; }
.cm-year { color: var(--ink); }
.cm-rate { display: flex; align-items: center; gap: 4px; color: var(--ink); }
.cm-access { display: flex; align-items: center; gap: 5px; color: rgba(26,18,48,.7); min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.cm-badge-row { display: flex; gap: 6px; flex-wrap: nowrap; overflow: hidden; }
.cm-badge { font-size: 11.5px; font-weight: 800; padding: 4px 10px; border-radius: 999px; white-space: nowrap; }
.cm-tag { font-size: 11.5px; font-weight: 700; padding: 4px 10px; border-radius: 999px; color: var(--ink); white-space: nowrap; }
.cm-synopsis { font-size: 12.5px; font-weight: 600; line-height: 1.4; color: rgba(26,18,48,.78); margin: 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.cm-stamp { position: absolute; top: 56px; font-family: var(--font-display); text-transform: uppercase; font-size: 30px; line-height: 1; letter-spacing: .02em; padding: 9px 14px 8px; border-radius: 14px; pointer-events: none; z-index: 3; }
.cm-stamp-like { left: 18px; background: var(--pink); color: #fff; transform: rotate(-12deg); }
.cm-stamp-pass { right: 18px; background: var(--red); color: #fff; transform: rotate(12deg); }

/* P\xF3ster dentro del boleto */
.cm-poster { position: relative; flex: 1 1 0; min-height: 150px; margin: 4px 0 14px; border-radius: 18px; overflow: hidden; background: var(--ink); display: flex; align-items: center; justify-content: center; }
.cm-poster-bg { position: absolute; inset: -24px; background-size: cover; background-position: center; filter: blur(22px) brightness(.6) saturate(1.2); }
.cm-poster img { position: relative; max-width: 100%; max-height: 100%; height: 100%; width: auto; object-fit: contain; user-select: none; -webkit-user-drag: none; pointer-events: none; transition: opacity .25s; }
.cm-poster-loading img { opacity: 0; }

.cm-poster-fallback { flex-direction: column; gap: 8px; color: var(--cream); font-size: 13px; font-weight: 700; }

.cm-actions { display: flex; align-items: center; justify-content: center; gap: 30px; padding: 14px 0 8px; }
.cm-action-btn { position: relative; width: 78px; height: 78px; border-radius: 50%; display: grid; place-items: center; cursor: pointer; border: 0; transition: transform .1s ease; }
.cm-action-btn::after { content: ""; position: absolute; inset: 6px; border: 3px dashed rgba(255,255,255,.55); border-radius: 50%; pointer-events: none; }

.cm-action-like { background: var(--gold); }
.cm-action-like::after { border-color: rgba(26,18,48,.35); }

.cm-waiting { gap: 14px; }
.cm-spin { animation: cmSpin 1s linear infinite; }
@keyframes cmSpin { to { transform: rotate(360deg); } }
.cm-code-reminder { display: flex; align-items: center; gap: 8px; color: var(--text-dim); font-size: 13px; font-weight: 600; margin-top: 4px; }

.cm-arc text { font-family: var(--font-display); }
@keyframes cmPop { from { opacity: 0; transform: scale(.55) rotate(-6deg); } to { opacity: 1; transform: none; } }

.cm-match-list { display: flex; flex-direction: column; gap: 10px; }
.cm-match-item { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; cursor: pointer; color: var(--text); background: var(--navy); border: 3px solid transparent; border-radius: 18px; padding: 8px 12px 8px 8px; }
.cm-match-thumb { flex-shrink: 0; width: 42px; height: 62px; border-radius: 8px; background: var(--ink); overflow: hidden; display: block; }
.cm-match-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cm-match-info { display: flex; flex-direction: column; gap: 3px; min-width: 0; }
.cm-match-title { font-family: var(--font-display); text-transform: uppercase; font-size: 21px; line-height: 1; letter-spacing: .01em; }
.cm-match-sub { font-size: 12px; font-weight: 600; color: var(--text-dim); }
.cm-match-focus { border-color: var(--gold); }
.cm-match-active { background: var(--navy-2); border-color: var(--pink); }
.cm-match-final { border-color: var(--gold); background: var(--navy-2); }

.cm-where { background: var(--cream); color: var(--ink); border-radius: 22px; padding: 16px; display: flex; flex-direction: column; gap: 10px; animation: cmPop .35s cubic-bezier(.2,1.4,.4,1) both; }
.cm-where-title { font-family: var(--font-display); font-weight: 400; text-transform: uppercase; font-size: 24px; line-height: 1; margin: 0; }
.cm-where-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.cm-where-types { font-weight: 700; font-size: 14px; color: rgba(26,18,48,.8); }
.cm-where-note { margin: 0; font-size: 12px; font-weight: 600; color: rgba(26,18,48,.6); }
.cm-result-actions { display: flex; flex-direction: column; gap: 14px; margin-top: 4px; padding: 0 8px; }

/* ---------- Confeti ---------- */
.cm-confetti { position: fixed; inset: 0; overflow: hidden; pointer-events: none; z-index: 20; }
.cm-piece { position: absolute; top: -40px; display: block; animation: cmFall linear both; }
@keyframes cmFall {
  0% { transform: translate3d(0, -8vh, 0) rotate(0deg); opacity: 0; }
  8% { opacity: 1; }

}

.cinematch-root button:focus-visible, .cinematch-root input:focus-visible { outline: 3px solid var(--pink-soft); outline-offset: 3px; }

@media (prefers-reduced-motion: reduce) {

@media (max-width: 380px) {
  .cm-actions { gap: 22px; }
  .cm-action-btn { width: 70px; height: 70px; }
  .cm-btn { font-size: 16px; padding: 16px 18px; }
}
